<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DotJSON</title>
  <link rel="stylesheet" href="index.css" />
</head>
<body>
  <div id="app">
    <header class="toolbar" role="toolbar">
      <div class="toolbar-group">
        <button type="button" id="btn-format" title="格式化 JSON">格式化</button>
        <button type="button" id="btn-minify" title="压缩 JSON">压缩</button>
        <label class="indent-label" title="缩进">
          缩进
          <select id="indent-select" aria-label="缩进">
            <option value="twoSpaces">2 spaces</option>
            <option value="fourSpaces" selected>4 spaces</option>
            <option value="tab">Tab</option>
          </select>
        </label>
        <button type="button" id="btn-repair" title="尝试修复 Python/AI 风格 JSON">修复</button>
        <button type="button" id="btn-to-python" title="转为 Python 字面量">转 Python</button>
        <button type="button" id="btn-to-json" title="转为标准 JSON">转 JSON</button>
      </div>
      <div class="toolbar-group">
        <button type="button" id="btn-clear" title="清空">清空</button>
        <button type="button" id="btn-paste" title="从剪贴板粘贴并尝试格式化">粘贴</button>
        <button type="button" id="btn-copy" title="复制全文">复制</button>
        <button type="button" id="btn-diff" title="JSON 对比">对比</button>
        <button type="button" id="btn-jsonl" title="按 JSONL 浏览当前文本">JSONL</button>
      </div>
      <div class="toolbar-group">
        <button type="button" id="btn-open" title="打开文件">打开</button>
        <button type="button" id="btn-recent" title="最近文件">最近</button>
        <button type="button" id="btn-save" title="保存">保存</button>
        <button type="button" id="btn-save-as" title="另存为">另存为</button>
        <button type="button" id="btn-export" title="导出到文件">导出</button>
        <button type="button" id="btn-settings" title="设置">设置</button>
      </div>
      <div class="status" id="status" aria-live="polite">就绪</div>
    </header>

    <div id="tab-bar" class="tab-bar" role="tablist" aria-label="文档标签">
      <div id="tab-list" class="tab-list"></div>
      <button type="button" id="btn-new-tab" class="tab-new" title="新建标签">+</button>
    </div>

    <main class="panes">
      <section class="pane pane-editor" aria-label="文本编辑">
        <div class="pane-header editor-header">
          <span>文本</span>
          <span class="file-meta">
            <span id="dirty-mark" class="dirty-mark" hidden>•</span>
            <span id="file-label" class="file-label"></span>
          </span>
          <div class="editor-search" id="editor-search-bar">
            <input
              id="editor-search"
              type="search"
              placeholder="查找"
              autocomplete="off"
            />
            <button type="button" id="editor-search-prev" title="上一个">↑</button>
            <button type="button" id="editor-search-next" title="下一个">↓</button>
            <span id="editor-search-count" class="search-count"></span>
          </div>
        </div>
        <div id="jsonl-bar" class="jsonl-bar" hidden>
          <button type="button" id="jsonl-prev" title="上一条">上一条</button>
          <span id="jsonl-pos" class="jsonl-pos">0 / 0</span>
          <button type="button" id="jsonl-next" title="下一条">下一条</button>
          <button type="button" id="jsonl-exit" title="退出 JSONL 浏览">退出浏览</button>
        </div>
        <textarea
          id="editor"
          spellcheck="false"
          autocomplete="off"
          autocapitalize="off"
          placeholder='粘贴或输入 JSON，例如 {"hello": "world"}'
        ></textarea>
      </section>

      <div class="splitter" id="splitter" title="拖拽调整宽度"></div>

      <section class="pane pane-tree" aria-label="树浏览">
        <div class="pane-header tree-header">
          <span>树</span>
          <div class="tree-search" id="tree-search-bar">
            <input
              id="tree-search"
              type="search"
              placeholder="搜索 key / value / path"
              autocomplete="off"
            />
            <button type="button" id="search-prev" title="上一个">↑</button>
            <button type="button" id="search-next" title="下一个">↓</button>
            <span id="search-count" class="search-count"></span>
          </div>
        </div>
        <div id="jsonl-list" class="jsonl-list" hidden></div>
        <div id="tree" class="tree" tabindex="0"></div>
      </section>
    </main>
  </div>

  <ul id="context-menu" class="context-menu" hidden>
    <li data-action="copy-key">Copy Key</li>
    <li data-action="copy-value">Copy Value</li>
    <li data-action="copy-path">Copy JSON Path</li>
    <li data-action="expand-all">Expand All</li>
    <li data-action="collapse-all">Collapse All</li>
    <li data-action="delete-node">Delete Node</li>
  </ul>

  <ul id="tab-context-menu" class="context-menu" hidden>
    <li data-action="duplicate">复制</li>
    <li data-action="close">关闭</li>
    <li data-action="close-others">关闭其他</li>
  </ul>

  <ul id="recent-menu" class="context-menu recent-menu" hidden></ul>

  <div id="settings-panel" class="settings-panel" hidden>
    <div class="settings-card" role="dialog" aria-label="设置">
      <h2>设置</h2>
      <label class="settings-field">
        默认缩进
        <select id="settings-default-indent" aria-label="默认缩进">
          <option value="twoSpaces">2 spaces</option>
          <option value="fourSpaces">4 spaces</option>
          <option value="tab">Tab</option>
        </select>
      </label>
      <p class="settings-hint">仅影响新建标签，不改变已打开文档。</p>
      <button type="button" id="settings-close">关闭</button>
    </div>
  </div>

  <div id="diff-panel" class="diff-panel" hidden>
    <div class="diff-panel-inner">
      <div class="diff-panel-header">
        <span>JSON 对比</span>
        <button type="button" id="diff-close" title="关闭">关闭</button>
      </div>
      <div class="diff-sources">
        <div class="diff-side">
          <div class="diff-side-toolbar">
            <label>
              左
              <select id="diff-left-select" aria-label="左侧来源标签"></select>
            </label>
            <button type="button" id="diff-left-current" title="使用当前标签">用当前标签</button>
          </div>
          <textarea
            id="diff-left-text"
            class="diff-text"
            spellcheck="false"
            autocomplete="off"
            placeholder="左侧 JSON"
          ></textarea>
        </div>
        <div class="diff-side">
          <div class="diff-side-toolbar">
            <label>
              右
              <select id="diff-right-select" aria-label="右侧来源标签"></select>
            </label>
            <button type="button" id="diff-right-current" title="使用当前标签">用当前标签</button>
          </div>
          <textarea
            id="diff-right-text"
            class="diff-text"
            spellcheck="false"
            autocomplete="off"
            placeholder="右侧 JSON"
          ></textarea>
        </div>
      </div>
      <div class="diff-rows-wrap">
        <div class="diff-rows-header">
          <span class="diff-col-path">path</span>
          <span class="diff-col-kind">kind</span>
          <span class="diff-col-left">左</span>
          <span class="diff-col-right">右</span>
        </div>
        <div id="diff-rows" class="diff-rows" role="listbox" aria-label="差异列表"></div>
      </div>
      <div class="diff-actions">
        <button type="button" id="diff-apply-left" title="将选中差异应用到左">应用到左</button>
        <button type="button" id="diff-apply-right" title="将选中差异应用到右">应用到右</button>
        <button type="button" id="diff-apply-all-left" title="将全部差异应用到左">全部到左</button>
        <button type="button" id="diff-apply-all-right" title="将全部差异应用到右">全部到右</button>
      </div>
    </div>
  </div>

  <script src="lib/json-core.js"></script>
  <script src="lib/json-diff.js"></script>
  <script src="lib/jsonl.js"></script>
  <script src="lib/python-literal.js"></script>
  <script src="lib/tree-edit.js"></script>
  <script src="state/document.js"></script>
  <script src="state/preferences.js"></script>
  <script src="state/workspace.js"></script>
  <script src="app/main.js"></script>
</body>
</html>
